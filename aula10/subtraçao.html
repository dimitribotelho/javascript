<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subtraçao</title>
</head>
<body>
  <h1>bem vindo a subtraçao </h1>
  <input type="number" name="men1" id="men1"> -
  <input type="number" name="men2" id="men2">
  <input type="button" value="subtraia" onclick="menos()"> 
  <div id="res">resultado da sua conta ficara aqui!</div> 
  <script>
   function menos() {
   var me1= window.document.getElementById("men1")
   var me2= window.document.getElementById("men2")
   var res= window.document.getElementById("res")
   var m1= Number(men1.value)
   var m2= Number(men2.value)
   var r= m1 - m2
   res.innerHTML="a subtraçao entre "+ m1 + " menos "+ m2 +" resulta em "+ r
   }
  </script>


</body>
</html>
