<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eventos dom</title>
</head>
 <style>
   div#area{
    font:normal 20pt arial;
    background-color: brown;
    color: aliceblue;
    width: 200px;
    line-height: 200px;
    text-align: center; }
</style>
<body>
 <div id="area">
    interaja
 </div>
 
 <script>
    var a= window.document.getElementById('area')
    a.addEventListener('click', clicar)
    a.addeventlistener('mouseenter',    )
    a.addEventListener('mouseout', sair)
    function clicar() {
        a.innerText="clicou" 
    }
    function entar() {
        a.innerText= "entrou"

    }
    function sair() { 
        a.innertext= "saiu"
    }
 </script>
</body>
</html>
